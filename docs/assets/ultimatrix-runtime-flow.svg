<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Ultimatrix end-to-end runtime workflow</title>
  <desc id="desc">Three-lane workflow showing the human and policy lane, research brain lane, and deterministic runtime lane from target intake through observation, skill selection, execution, evidence proof, findings, and memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091014"/><stop offset="1" stop-color="#121d22"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2be08a"/></marker>
    <marker id="cyan-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#36c9e6"/></marker>
    <marker id="amber-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ffb020"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#36c9e6" stroke-opacity=".055"/></pattern>
  </defs>

  <rect width="1400" height="860" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="858" rx="25" fill="url(#grid)" stroke="#2be08a" stroke-opacity=".25"/>
  <text x="52" y="56" fill="#2be08a" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3">ULTIMATRIX // END-TO-END TRAVERSAL</text>
  <text x="52" y="93" fill="#e7f7f0" font-family="Inter, sans-serif" font-size="28" font-weight="700">One question travels through three kinds of control.</text>
  <text x="52" y="122" fill="#8fa9ad" font-family="Inter, sans-serif" font-size="14">The model chooses the investigation. Deterministic services constrain, execute, verify, and remember it.</text>

  <g font-family="ui-monospace, monospace" font-size="13">
    <rect x="52" y="160" width="1296" height="172" rx="16" fill="#102021" stroke="#36c9e6" stroke-opacity=".45"/>
    <rect x="52" y="348" width="1296" height="210" rx="16" fill="#111e1b" stroke="#2be08a" stroke-opacity=".45"/>
    <rect x="52" y="574" width="1296" height="212" rx="16" fill="#211c14" stroke="#ffb020" stroke-opacity=".45"/>
    <text x="76" y="195" fill="#36c9e6" font-size="13" letter-spacing="2">HUMAN + POLICY LANE</text>
    <text x="76" y="383" fill="#2be08a" font-size="13" letter-spacing="2">RESEARCH BRAIN LANE</text>
    <text x="76" y="609" fill="#ffb020" font-size="13" letter-spacing="2">RUNTIME + EVIDENCE LANE</text>
  </g>

  <!-- Human lane -->
  <g font-family="ui-monospace, monospace">
    <g transform="translate(82 220)"><rect width="190" height="78" rx="10" fill="#152d34" stroke="#36c9e6"/><text x="16" y="27" fill="#e7f7f0" font-size="15" font-weight="700">INTENT</text><text x="16" y="51" fill="#a6c3c8" font-size="12">goal + target + scope</text></g>
    <g transform="translate(330 220)"><rect width="190" height="78" rx="10" fill="#152d34" stroke="#36c9e6"/><text x="16" y="27" fill="#e7f7f0" font-size="15" font-weight="700">INTERACT</text><text x="16" y="51" fill="#a6c3c8" font-size="12">ask / browser / approve</text></g>
    <g transform="translate(578 220)"><rect width="190" height="78" rx="10" fill="#152d34" stroke="#36c9e6"/><text x="16" y="27" fill="#e7f7f0" font-size="15" font-weight="700">RUN POLICY</text><text x="16" y="51" fill="#a6c3c8" font-size="12">scope / budget / mode</text></g>
    <g transform="translate(826 220)"><rect width="190" height="78" rx="10" fill="#152d34" stroke="#36c9e6"/><text x="16" y="27" fill="#e7f7f0" font-size="15" font-weight="700">HITL GATE</text><text x="16" y="51" fill="#a6c3c8" font-size="12">context when needed</text></g>
    <g transform="translate(1074 220)"><rect width="190" height="78" rx="10" fill="#152d34" stroke="#36c9e6"/><text x="16" y="27" fill="#e7f7f0" font-size="15" font-weight="700">CHECKPOINT</text><text x="16" y="51" fill="#a6c3c8" font-size="12">checkpoint / redirect</text></g>
  </g>
  <path d="M272 259h50M520 259h50M768 259h50M1016 259h50" stroke="#36c9e6" stroke-width="2" marker-end="url(#cyan-arrow)"/>

  <!-- Brain lane -->
  <g font-family="ui-monospace, monospace">
    <g transform="translate(82 408)"><rect width="190" height="104" rx="10" fill="#142c22" stroke="#2be08a"/><text x="16" y="28" fill="#e7f7f0" font-size="15" font-weight="700">OBSERVE</text><text x="16" y="52" fill="#a7c7b4" font-size="12">surface + graph state</text><text x="16" y="73" fill="#a7c7b4" font-size="12">facts + frontier</text></g>
    <g transform="translate(330 408)"><rect width="190" height="104" rx="10" fill="#142c22" stroke="#2be08a"/><text x="16" y="28" fill="#e7f7f0" font-size="15" font-weight="700">ORIENT</text><text x="16" y="52" fill="#a7c7b4" font-size="12">hypothesis + attack path</text><text x="16" y="73" fill="#a7c7b4" font-size="12">research map</text></g>
    <g transform="translate(578 408)"><rect width="190" height="104" rx="10" fill="#142c22" stroke="#2be08a"/><text x="16" y="28" fill="#e7f7f0" font-size="15" font-weight="700">SELECT</text><text x="16" y="52" fill="#a7c7b4" font-size="12">skill + capability pack</text><text x="16" y="73" fill="#a7c7b4" font-size="12">model + worker route</text></g>
    <g transform="translate(826 408)"><rect width="190" height="104" rx="10" fill="#142c22" stroke="#2be08a"/><text x="16" y="28" fill="#e7f7f0" font-size="15" font-weight="700">PLAN</text><text x="16" y="52" fill="#a7c7b4" font-size="12">baseline / mutation</text><text x="16" y="73" fill="#a7c7b4" font-size="12">compare / reproduce</text></g>
    <g transform="translate(1074 408)"><rect width="190" height="104" rx="10" fill="#142c22" stroke="#2be08a"/><text x="16" y="28" fill="#e7f7f0" font-size="15" font-weight="700">CONCLUDE</text><text x="16" y="52" fill="#a7c7b4" font-size="12">finding / lead / pivot</text><text x="16" y="73" fill="#a7c7b4" font-size="12">next question</text></g>
  </g>
  <path d="M272 460h50M520 460h50M768 460h50M1016 460h50" stroke="#2be08a" stroke-width="2" marker-end="url(#green-arrow)"/>

  <!-- Runtime lane -->
  <g font-family="ui-monospace, monospace">
    <g transform="translate(82 634)"><rect width="190" height="116" rx="10" fill="#302519" stroke="#ffb020"/><text x="16" y="28" fill="#fff3d2" font-size="15" font-weight="700">CAPTURE</text><text x="16" y="52" fill="#d7c39b" font-size="12">browser / HTTP / HAR</text><text x="16" y="73" fill="#d7c39b" font-size="12">tool result + provenance</text></g>
    <g transform="translate(330 634)"><rect width="190" height="116" rx="10" fill="#302519" stroke="#ffb020"/><text x="16" y="28" fill="#fff3d2" font-size="15" font-weight="700">EXECUTE</text><text x="16" y="52" fill="#d7c39b" font-size="12">replay / campaign / worker</text><text x="16" y="73" fill="#d7c39b" font-size="12">sandbox when available</text></g>
    <g transform="translate(578 634)"><rect width="190" height="116" rx="10" fill="#302519" stroke="#ffb020"/><text x="16" y="28" fill="#fff3d2" font-size="15" font-weight="700">EVIDENCE</text><text x="16" y="52" fill="#d7c39b" font-size="12">ledger + differential</text><text x="16" y="73" fill="#d7c39b" font-size="12">actor + state + response</text></g>
    <g transform="translate(826 634)"><rect width="190" height="116" rx="10" fill="#302519" stroke="#ffb020"/><text x="16" y="28" fill="#fff3d2" font-size="15" font-weight="700">PROOF GATE</text><text x="16" y="52" fill="#d7c39b" font-size="12">claim verification</text><text x="16" y="73" fill="#d7c39b" font-size="12">finding / exploit proof</text></g>
    <g transform="translate(1074 634)"><rect width="190" height="116" rx="10" fill="#302519" stroke="#ffb020"/><text x="16" y="28" fill="#fff3d2" font-size="15" font-weight="700">PERSIST</text><text x="16" y="52" fill="#d7c39b" font-size="12">graph + reflexion</text><text x="16" y="73" fill="#d7c39b" font-size="12">report + next turn</text></g>
  </g>
  <path d="M177 634V512" stroke="#ffb020" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <path d="M425 634V512" stroke="#ffb020" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <path d="M673 634V512" stroke="#ffb020" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <path d="M921 634V512" stroke="#ffb020" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <path d="M1169 634V512" stroke="#ffb020" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <path d="M1169 750 C1169 820 177 820 177 750" fill="none" stroke="#2be08a" stroke-width="2" stroke-opacity=".7" marker-end="url(#green-arrow)"/>
  <text x="700" y="838" fill="#7faaa3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle" letter-spacing="1">The next turn starts with the case state, not an empty prompt.</text>
</svg>
