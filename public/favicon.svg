<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient for the rounded square -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>

    <!-- Metallic silver for the outer ring -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c8d4"/>
      <stop offset="40%" stop-color="#e8ecf2"/>
      <stop offset="60%" stop-color="#a8b0bc"/>
      <stop offset="100%" stop-color="#d0d6e0"/>
    </linearGradient>

    <!-- Emerald green for the hourglass -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle inner glow -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="72" ry="72" fill="url(#bgGrad)"/>

  <!-- Subtle outer shadow ring -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#0a0c10" stroke-width="8" opacity="0.6"/>

  <!-- Outer metallic ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#silverGrad)" stroke-width="14"/>

  <!-- Inner thin ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#8a94a4" stroke-width="3" opacity="0.7"/>

  <!-- Four subtle micro-spikes (shortened & refined) -->
  <!-- Top -->
  <polygon points="256,48 268,78 244,78" fill="url(#silverGrad)"/>
  <!-- Right -->
  <polygon points="464,256 434,268 434,244" fill="url(#silverGrad)"/>
  <!-- Bottom -->
  <polygon points="256,464 244,434 268,434" fill="url(#silverGrad)"/>
  <!-- Left -->
  <polygon points="48,256 78,244 78,268" fill="url(#silverGrad)"/>

  <!-- Circuit pattern (simplified, elegant) -->
  <g fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.35">
    <!-- Concentric arcs / circuit rings -->
    <circle cx="256" cy="256" r="145" stroke-dasharray="8 12"/>
    <circle cx="256" cy="256" r="125" stroke-dasharray="4 10"/>

    <!-- Horizontal circuit lines -->
    <path d="M110 256 H160"/>
    <path d="M352 256 H402"/>
    <path d="M130 210 H190"/>
    <path d="M322 210 H382"/>
    <path d="M130 302 H190"/>
    <path d="M322 302 H382"/>

    <!-- Vertical circuit lines -->
    <path d="M256 110 V160"/>
    <path d="M256 352 V402"/>
    <path d="M210 130 V190"/>
    <path d="M302 130 V190"/>
    <path d="M210 322 V382"/>
    <path d="M302 322 V382"/>

    <!-- Small circuit nodes -->
    <circle cx="160" cy="256" r="3.5" fill="#10b981" stroke="none"/>
    <circle cx="352" cy="256" r="3.5" fill="#10b981" stroke="none"/>
    <circle cx="256" cy="160" r="3.5" fill="#10b981" stroke="none"/>
    <circle cx="256" cy="352" r="3.5" fill="#10b981" stroke="none"/>
    <circle cx="190" cy="210" r="2.5" fill="#10b981" stroke="none"/>
    <circle cx="322" cy="210" r="2.5" fill="#10b981" stroke="none"/>
    <circle cx="190" cy="302" r="2.5" fill="#10b981" stroke="none"/>
    <circle cx="322" cy="302" r="2.5" fill="#10b981" stroke="none"/>
  </g>

  <!-- Hourglass outer frame (silver) -->
  <path d="M176 140
           L336 140
           L280 256
           L336 372
           L176 372
           L232 256
           Z"
        fill="none"
        stroke="url(#silverGrad)"
        stroke-width="10"
        stroke-linejoin="round"/>

  <!-- Hourglass upper triangle (glowing green) -->
  <path d="M196 155
           L316 155
           L256 248
           Z"
        fill="url(#greenGrad)"
        filter="url(#glow)"/>

  <!-- Hourglass lower triangle (glowing green) -->
  <path d="M196 357
           L316 357
           L256 264
           Z"
        fill="url(#greenGrad)"
        filter="url(#glow)"/>

  <!-- Center connector band -->
  <rect x="232" y="248" width="48" height="16" rx="3" fill="url(#silverGrad)"/>

  <!-- Subtle highlight on hourglass -->
  <path d="M210 165 L290 165 L256 235 Z" fill="#6ee7b7" opacity="0.25"/>
</svg>
