engine: multi-model
provider: nvidia
model: nvidia/nemotron-3-super-120b-a12b
modelTiers:
  fast:
    provider: nvidia
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  balanced:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
  powerful:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
browser:
  headless: false
  viewport:
    width: 1280
    height: 720
  domSettleTimeout: 5000
  env: LOCAL
  selfHeal: true
  verbose: 0
memory:
  lastMessages: 10
  semanticRecall: false
  workingMemory: true
agent:
  maxSteps: 25
  scansDir: ./scans
