provider: nvidia
model: nvidia/nemotron-3-ultra-550b-a55b
engine: solver
solver:
  maxToolCalls: 50
  maxTokens: 100000
  maxDurationMs: 300000
  maxParallel: 1
antiLoop:
  staleThreshold: 3
rateLimit:
  requestsPerMinute: 25
  maxConcurrent: 3
  retryOnLimit: true
  maxRetries: 3
browser:
  headless: false
  viewport:
    width: 1280
    height: 720
  domSettleTimeout: 5000
  env: LOCAL
  selfHeal: true
  verbose: 0
memory:
  lastMessages: 10
  semanticRecall: false
  workingMemory: true
agent:
  maxSteps: 50
  scansDir: ./scans
